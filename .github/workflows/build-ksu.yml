name: Build polaris KernelSU Next kernel
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: polaris-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout fixed project source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3 curl bzip2 xz-utils
      - name: Test compatibility error paths
        run: bash build-support/run-tests.sh
      - name: Build and verify KSU kernel
        env:
          JOBS: '2'
        run: |
          set -o pipefail
          mkdir -p dist
          bash build-support/build.sh 2>&1 | tee dist/build.log
      - name: Check public artifact contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = {'Image.gz-dtb', 'Module.symvers', 'kernel.config', 'SHA256SUMS', 'validation.json', 'build-manifest.json', 'provenance.json', 'COPYING', 'build.log'}
          files = {p.name for p in Path('dist').iterdir() if p.is_file()}
          assert files == required, f'Unexpected or missing artifacts: {files ^ required}'
          assert all(p.is_file() and not p.is_symlink() for p in Path('dist').iterdir())
          PY
      - name: Upload kernel and build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-ksunext-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
